<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blue Marble MVP</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page">
    <h1>블루마블 MVP</h1>

    <section class="app-layout">
      <section class="board-section">
        <div id="board" class="board" aria-label="게임 보드"></div>
      </section>

      <aside class="side-panel">
        <section class="panel setup-panel">
          <h2>게임 설정</h2>
          <label for="player-count">플레이어 수</label>
          <select id="player-count">
            <option value="2" selected>2명</option>
            <option value="3">3명</option>
            <option value="4">4명</option>
          </select>
          <button id="start-btn">게임 시작</button>
          <div id="player-name-inputs" class="name-inputs"></div>
        </section>

        <section class="panel turn-panel">
          <h2>현재 턴</h2>
          <div id="turn-info" class="turn-info">설정 후 게임 시작</div>
          <div id="last-roll" class="last-roll">최근 주사위: -</div>
        </section>

        <section class="panel actions-panel">
          <h2>액션</h2>
          <div class="actions-grid">
            <button id="roll-btn">주사위 굴리기</button>
            <button id="buy-btn">구매</button>
            <button id="pass-btn">패스</button>
            <button id="end-turn-btn">턴 종료</button>
          </div>
        </section>

        <section class="panel players-panel">
          <h2>플레이어 자산/상태</h2>
          <ul id="players-list" class="players-list"></ul>
        </section>
        
      </aside>
    </section>

    <section class="panel log-panel">
      <h2>행동 로그</h2>
      <div id="log-list" class="log-list" aria-live="polite"></div>
    </section>
  </main>

  <div id="owned-cities-modal" class="modal-overlay" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="owned-cities-title">
      <div class="modal-head">
        <h3 id="owned-cities-title">보유 도시</h3>
        <button id="owned-cities-close" class="modal-close" type="button" aria-label="닫기">닫기</button>
      </div>
      <div id="owned-cities-body" class="modal-body"></div>
    </div>
  </div>

  <div id="city-arrival-modal" class="modal-overlay" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="city-arrival-title">
      <div class="modal-head">
        <h3 id="city-arrival-title">도시 정보</h3>
        <button id="city-arrival-close" class="modal-close" type="button" aria-label="닫기">닫기</button>
      </div>
      <div id="city-arrival-body" class="modal-body"></div>
      <div class="modal-actions">
        <button id="city-buy-btn" type="button">구매</button>
        <button id="city-pass-btn" type="button">패스</button>
        <button id="city-end-btn" type="button">턴 종료</button>
        <button id="city-build-house-btn" type="button">집 건설</button>
        <button id="city-build-building-btn" type="button">빌딩 건설</button>
        <button id="city-build-hotel-btn" type="button">호텔 건설</button>
      </div>
    </div>
  </div>

  <div id="toast-container" class="toast-container" aria-live="polite" aria-atomic="false"></div>

  <script src="app.js" defer></script>
</body>
</html>
